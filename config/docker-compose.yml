services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guide-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: GameSage
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data